global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Go 网关指标（docker 内部地址）
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  # Python FastAPI 指标
  - job_name: "fastapi"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics/python

  # Prometheus 自身
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
